name: Validate collection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- docs/gallery.md docs/templates.md docs/cases
